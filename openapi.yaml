      properties:
        title:
          type: string
          minLength: 1
        author:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
        category:
          $ref: '#/components/schemas/BookCategory'
        stock:
          type: integer
          minimum: 0
    UpdateBookRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        author:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
        category:
          $ref: '#/components/schemas/BookCategory'
        stock:
          type: integer
          minimum: 0
    PublicBook:
      type: object
      required: [id, title, author, description, price, category, stock, availability, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        author:
          type: string
        description:
          type: string
        price:
          type: number
        category:
          $ref: '#/components/schemas/BookCategory'
        stock:
          type: integer
          minimum: 0
        availability:
          type: string
          enum: [In Stock, Out of Stock]
        createdAt:
          type: string
          format: date-time
    AdminBook:
      allOf:
        - $ref: '#/components/schemas/PublicBook'
        - type: object
          required: [isDeleted, deletedAt, updatedAt]
          properties:
            isDeleted:
              type: boolean
            deletedAt:
              type: string
              format: date-time
              nullable: true
            updatedAt:
              type: string
              format: date-time
    PublicBookResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [book]
          properties:
            book:
              $ref: '#/components/schemas/PublicBook'
    AdminBookResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [book]
          properties:
            book:
              $ref: '#/components/schemas/AdminBook'
    Pagination:
      type: object
      required: [total, page, limit, totalPages]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
        totalPages:
          type: integer
          minimum: 0
    BookListResponse:
      type: object
      required: [status, data, pagination]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicBook'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CartBook:
      type: object
      required: [id, title, author, description, price, category]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        author:
          type: string
        description:
          type: string
        price:
          type: number
        category:
          $ref: '#/components/schemas/BookCategory'
    CartItem:
      type: object
      required:
        - book
        - quantity
        - currentPrice
        - currentStock
        - availableQuantity
        - availability
        - requestedSubtotal
        - availableSubtotal
      properties:
        book:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CartBook'
        quantity:
          type: integer
          minimum: 1
        currentPrice:
          type: number
          minimum: 0
        currentStock:
          type: integer
          minimum: 0
        availableQuantity:
          type: integer
          minimum: 0
        availability:
          type: string
          enum: [In Stock, Insufficient Stock, Out of Stock, Unavailable]
        requestedSubtotal:
          type: number
          minimum: 0
        availableSubtotal:
          type: number
          minimum: 0
    Cart:
      type: object
      required: [items, requestedTotal, availableItemsTotal]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        requestedTotal:
          type: number
          minimum: 0
        availableItemsTotal:
          type: number
          minimum: 0
    CartResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/Cart'
    AddCartItemRequest:
      type: object
      additionalProperties: false
      required: [bookId, quantity]
      properties:
        bookId:
          $ref: '#/components/schemas/ObjectId'
        quantity:
          type: integer
          minimum: 1
    UpdateCartItemRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
    OrderItem:
      type: object
      required: [bookId, title, author, price, quantity, subtotal]
      properties:
        bookId:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        author:
          type: string
        price:
          type: number
          minimum: 0
        quantity:
          type: integer
          minimum: 1
        subtotal:
          type: number
          minimum: 0
    Order:
      type: object
      required: [id, items, totalPrice, status, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        totalPrice:
          type: number
          minimum: 0
        status:
          type: string
          enum: [pending, paid, shipped, cancelled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [order]
          properties:
            order:
              $ref: '#/components/schemas/Order'
    OrderListResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [orders]
          properties:
            orders:
              type: array
              items:
                $ref: '#/components/schemas/Order'
    PaymentRequest:
      type: object
      additionalProperties: false
      required: [orderId, cardNumber]
      properties:
        orderId:
          $ref: '#/components/schemas/ObjectId'
        cardNumber:
          type: string
          writeOnly: true
          pattern: '^\d{16}$'
          minLength: 16
          maxLength: 16
          example: '1234567890123456'
    PaymentData:
      type: object
      required: [orderId, paymentStatus, orderStatus]
      properties:
        orderId:
          $ref: '#/components/schemas/ObjectId'
        paymentStatus:
          type: string
          enum: [succeeded, failed]
        orderStatus:
          type: string
          enum: [paid, pending]
    PaymentResponse:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
          enum: [Payment successful, Payment failed]
        data:
          $ref: '#/components/schemas/PaymentData'
