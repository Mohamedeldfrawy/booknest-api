openapi: 3.0.3
info:
  title: BookNest API
  version: unverified
  description: |
    Backend API for the BookNest bookstore.

    The deployed API host, contact details, and production versioning URL were
    not verifiable from the inspected source code and are therefore omitted.
servers: []
tags:
  - name: Root
  - name: Health
  - name: Authentication
  - name: Users
  - name: Books
  - name: Cart
  - name: Orders
  - name: Payments
paths:
  /:
    get:
      tags: [Root]
      summary: Get API status
      operationId: getRootStatus
      security: []
      responses:
        '200':
          description: API is running.
          content:
            text/plain:
              schema:
                type: string
                example: BookNest API is running
  /health:
    get:
      tags: [Health]
      summary: Check API health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Health check succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /api/users/register:
    post:
      tags: [Users]
      summary: Register a customer
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Jane Doe
              email: jane.doe@example.com
              password: Password123
      responses:
        '201':
          description: Customer registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: A user with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: USER_ALREADY_EXISTS
                message: A user with this email already exists
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/login:
    post:
      tags: [Authentication]
      summary: Log in
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: jane.doe@example.com
              password: Password123
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credentials are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INVALID_CREDENTIALS
                message: Invalid email or password
        '429':
          $ref: '#/components/responses/LoginRateLimit'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          description: The authenticated user's profile was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: USER_NOT_FOUND
                message: User profile not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              name: Jane Smith
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          description: The authenticated user's profile was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: USER_NOT_FOUND
                message: User profile not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/books:
    get:
      tags: [Books]
      summary: Browse books
      operationId: listBooks
      security: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/BookSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Filtered, sorted, and paginated active books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Books]
      summary: Create a book
      description: Requires an authenticated user with the admin role.
      operationId: createBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
            example:
              title: Clean Code
              author: Robert C. Martin
              description: A handbook of agile software craftsmanship.
              price: 39.99
              category: programming
              stock: 12
      responses:
        '201':
          description: Book created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A book with the same normalized title and author already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: BOOK_ALREADY_EXISTS
                message: A book with this title and author already exists
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/books/{id}:
    get:
      tags: [Books]
      summary: Get an active book
      operationId: getBook
      security: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: Active book details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBookResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: The book does not exist or is soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: BOOK_NOT_FOUND
                message: Book not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Books]
      summary: Update a book
      description: Requires an authenticated user with the admin role.
      operationId: updateBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
            example:
              price: 42.99
              stock: 20
      responses:
        '200':
          description: Book updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The book does not exist or is soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: BOOK_NOT_FOUND
                message: Book not found
        '409':
          description: The updated title and author conflict with another book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: BOOK_ALREADY_EXISTS
                message: A book with this title and author already exists
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Books]
      summary: Soft-delete a book
      description: Requires an authenticated user with the admin role.
      operationId: deleteBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: Book soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Book deleted successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The book does not exist or is already soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: BOOK_NOT_FOUND
                message: Book not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cart:
    get:
      tags: [Cart]
      summary: Get the authenticated user's cart
      operationId: getCart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart returned. Missing or soft-deleted books are represented as unavailable items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cart/items:
    post:
      tags: [Cart]
      summary: Add a book to the authenticated user's cart
      operationId: addCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
            example:
              bookId: 507f1f77bcf86cd799439011
              quantity: 2
      responses:
        '200':
          description: Item added and cart returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          description: The book does not exist or is soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: BOOK_NOT_FOUND
                message: Book not found
        '409':
          description: The book is unavailable or the requested quantity exceeds stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                outOfStock:
                  value:
                    status: error
                    code: CART_OUT_OF_STOCK
                    message: Book is out of stock
                quantityExceeded:
                  value:
                    status: error
                    code: CART_QUANTITY_EXCEEDED
                    message: Requested quantity exceeds available stock
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cart/items/{bookId}:
    patch:
      tags: [Cart]
      summary: Set a cart item's quantity
      operationId: updateCartItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CartBookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
            example:
              quantity: 3
      responses:
        '200':
          description: Cart item updated and cart returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          description: The book or cart item was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bookNotFound:
                  value:
                    status: error
                    code: BOOK_NOT_FOUND
                    message: Book not found
                cartItemNotFound:
                  value:
                    status: error
                    code: CART_ITEM_NOT_FOUND
                    message: Cart item not found
        '409':
          $ref: '#/components/responses/CartStockConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Cart]
      summary: Remove a cart item
      operationId: removeCartItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CartBookId'
      responses:
        '200':
          description: Cart item removed and cart returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          description: Cart item was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: CART_ITEM_NOT_FOUND
                message: Cart item not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders:
    post:
      tags: [Orders]
      summary: Check out the authenticated user's cart
      operationId: checkout
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Order created from the current cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '409':
          description: Checkout could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyCart:
                  value:
                    status: error
                    code: ORDER_CART_EMPTY
                    message: Cannot checkout with an empty cart
                unavailableBook:
                  value:
                    status: error
                    code: ORDER_BOOK_UNAVAILABLE
                    message: One or more books are no longer available
                insufficientStock:
                  value:
                    status: error
                    code: ORDER_STOCK_UNAVAILABLE
                    message: One or more books do not have sufficient stock
                checkoutConflict:
                  value:
                    status: error
                    code: ORDER_CHECKOUT_CONFLICT
                    message: Checkout could not be completed
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Orders]
      summary: List orders
      description: Customers receive their own orders. Admins receive all orders.
      operationId: listOrders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order
      description: Customers can access only their own orders. Admins can access any order.
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order returned with purchase-time snapshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          description: Order does not exist or is not accessible to the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: ORDER_NOT_FOUND
                message: Order not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/payments:
    post:
      tags: [Payments]
      summary: Simulate an order payment
      description: |
        Customers and admins may pay only for their own pending orders.
        The card number is used only for simulation and is never persisted or returned.
        A valid card ending in `0000` produces a failed payment while leaving the
        order pending. Other valid cards transition the order to paid.
      operationId: processPayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              orderId: 507f1f77bcf86cd799439011
              cardNumber: '1234567890123456'
      responses:
        '200':
          description: Payment simulation processed, whether it succeeded or failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                succeeded:
                  value:
                    status: success
                    message: Payment successful
                    data:
                      orderId: 507f1f77bcf86cd799439011
                      paymentStatus: succeeded
                      orderStatus: paid
                failed:
                  value:
                    status: success
                    message: Payment failed
                    data:
                      orderId: 507f1f77bcf86cd799439011
                      paymentStatus: failed
                      orderStatus: pending
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          description: Order does not exist or does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: ORDER_NOT_FOUND
                message: Order not found
        '409':
          description: Order is no longer eligible for payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: ORDER_PAYMENT_CONFLICT
                message: Order is not eligible for payment
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT supplied as `Authorization: Bearer <token>`.'
  parameters:
    BookId:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId of the book.
      schema:
        $ref: '#/components/schemas/ObjectId'
      example: 507f1f77bcf86cd799439011
    CartBookId:
      name: bookId
      in: path
      required: true
      description: MongoDB ObjectId of the book in the cart.
      schema:
        $ref: '#/components/schemas/ObjectId'
      example: 507f1f77bcf86cd799439011
    OrderId:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId of the order.
      schema:
        $ref: '#/components/schemas/ObjectId'
      example: 507f1f77bcf86cd799439011
    Search:
      name: search
      in: query
      required: false
      description: Partial, case-insensitive search across title and author.
      schema:
        type: string
        minLength: 1
        example: clean
    Category:
      name: category
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BookCategory'
    MinPrice:
      name: minPrice
      in: query
      required: false
      schema:
        type: number
        minimum: 0
        example: 10
    MaxPrice:
      name: maxPrice
      in: query
      required: false
      schema:
        type: number
        minimum: 0
        example: 50
    BookSort:
      name: sort
      in: query
      required: false
      description: Sort order. The service defaults to newest when omitted.
      schema:
        type: string
        enum: [price_asc, price_desc, newest, oldest]
        default: newest
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: VALIDATION_ERROR
            message: '"email" must be a valid email'
    AuthenticationRequired:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: AUTHENTICATION_REQUIRED
            message: Authentication required
    Forbidden:
      description: Authenticated user does not have the required role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: FORBIDDEN
            message: You do not have permission to perform this action
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: INTERNAL_SERVER_ERROR
            message: Internal server error
    LoginRateLimit:
      description: Too many login attempts.
      headers:
        RateLimit:
          schema:
            type: string
          description: Rate-limit metadata when provided by the limiter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitErrorResponse'
          example:
            status: error
            message: Too many login attempts. Please try again later.
    CartStockConflict:
      description: The book is unavailable or the requested quantity exceeds stock.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            outOfStock:
              value:
                status: error
                code: CART_OUT_OF_STOCK
                message: Book is out of stock
            quantityExceeded:
              value:
                status: error
                code: CART_QUANTITY_EXCEEDED
                message: Requested quantity exceeds available stock
  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 507f1f77bcf86cd799439011
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: string
          enum: [error]
        code:
          type: string
          description: Application error code.
        message:
          type: string
    RateLimitErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
          example: Too many login attempts. Please try again later.
    MessageResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          pattern: '^(?=.*[A-Za-z])(?=.*\d).{8,}$'
          format: password
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [customer, admin]
    RegisterResponse:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
          example: User registered successfully
        data:
          type: object
          required: [user, token]
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
    LoginResponse:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
          example: Login successful
        data:
          type: object
          required: [user, token]
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
    UserProfileResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    BookCategory:
